apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlp-proxy.fullname" . }}
  labels:
    {{- include "dlp-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dlp-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "dlp-proxy.labels" . | nindent 8 }}
      annotations:
        checksum/policy: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/protected-values-ref: {{ printf "%s/%s" .Values.protectedValues.existingSecret .Values.protectedValues.key | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DLP_POLICY_PATH
              value: /etc/dlp/policy.yaml
            {{- if .Values.protectedValues.existingSecret }}
            - name: DLP_PROTECTED_VALUES_PATH
              value: /var/run/secrets/dlp/protected-values.yaml
            - name: DLP_ENFORCE_PROTECTED_FILE_MODE
              value: "true"
            {{- end }}
          volumeMounts:
            - name: policy
              mountPath: /etc/dlp
              readOnly: true
            {{- if .Values.protectedValues.existingSecret }}
            - name: protected-values
              mountPath: /var/run/secrets/dlp
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: policy
          configMap:
            name: {{ include "dlp-proxy.fullname" . }}-policy
        {{- if .Values.protectedValues.existingSecret }}
        - name: protected-values
          secret:
            secretName: {{ .Values.protectedValues.existingSecret | quote }}
            optional: false
            defaultMode: 0440
            items:
              - key: {{ .Values.protectedValues.key | quote }}
                path: protected-values.yaml
        {{- end }}
