{{- if .Values.mockUpstream.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlp-proxy.fullname" . }}-mock-upstream
  labels:
    app.kubernetes.io/name: mock-upstream
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-upstream
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-upstream
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-upstream
          image: "{{ .Values.mockUpstream.image.repository }}{{ if .Values.mockUpstream.image.digest }}@{{ .Values.mockUpstream.image.digest }}{{ else }}:{{ .Values.mockUpstream.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.mockUpstream.image.pullPolicy }}
          ports:
            - containerPort: 9000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlp-proxy.fullname" . }}-mock-upstream
  labels:
    app.kubernetes.io/name: mock-upstream
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-upstream
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9000
      targetPort: http
{{- end }}
