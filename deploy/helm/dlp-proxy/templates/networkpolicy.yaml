{{- if .Values.networkPolicy.enabled }}
# Forces workloads labeled dlp-egress=via-proxy to talk only to the proxy —
# clients cannot bypass it inside the cluster. Requires a CNI that enforces
# NetworkPolicy (k3d/k3s default CNI does).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dlp-proxy.fullname" . }}-force-egress
  labels:
    {{- include "dlp-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      dlp-egress: via-proxy
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "dlp-proxy.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 8080
    # Cluster DNS only (still does not prevent DNS tunneling; see README).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
