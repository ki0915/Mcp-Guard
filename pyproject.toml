[project]
name = "dlp-proxy"
version = "0.1.0"
description = "Outbound DLP proxy for LLM/MCP traffic: detects Korean PII and corporate secrets, then redacts/blocks/alerts per policy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "regex>=2024.11.6,<2027",
]

[project.scripts]
dlp-stdio-proxy = "dlp_proxy.stdio_proxy:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "anyio>=4.0,<5",
    "ruff>=0.6,<1",
    "bandit>=1.8,<2",
]

[tool.setuptools.packages.find]
include = ["dlp_proxy*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
